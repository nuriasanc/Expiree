<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Expiree</title>

    <link rel="stylesheet" href="src/styles/login.css">
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/modal.css">
    <link rel="stylesheet" href="src/styles/list.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

    <!--LOGIN-->
    <div id="login" class="hidden">

        <h1>Expiree</h1>

        <input id="email" type="email" placeholder="Correo electrónico">

        <input id="password" type="password" placeholder="Contraseña">

        <p id="authError"></p>

        <button onclick="login()">Entrar</button>

        <button onclick="signup()">Crear cuenta</button>

    </div>

    <!-- APP -->
    <div id="app" class="hidden">

        <header>

    <h3 class="logo">
        Expiree
    </h3>


    <div class="user-menu">

        <button class="user-btn" onclick="toggleMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" 
                viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" 
                stroke-linecap="round" stroke-linejoin="round">

                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />

            </svg>
        </button>

        <div id="menu" class="menu hidden">
            <button onclick="logout()">
                Cerrar sesión
            </button>
        </div>

    </div>


        </header>

        <!-- MODAL -->
        <div class="modal hidden" id="modal">

            <div class="modal-anadir-alimentos">

                <div class="cabecera-modal">
                    <h3>Añadir alimento</h3>
                    <button class="cerrar" onclick="cerrarModal()">✕</button>
                </div>

                <div class="modal-body">

                    <input type="text" placeholder="Alimento" id="nombre">

                    <div class="botonera">
                        <button class="frigo cat" id="cat1" onclick="setCat(1)"> Nevera</button>
                        <button class="conge cat" id="cat2" onclick="setCat(2)">Congelador</button>
                        <button class="despe cat" id="cat3" onclick="setCat(3)">Despensa</button>
                    </div>

                    <div class="botonera-2">

                        <input type="date" id="fecha">

                        <div class="cantidad-selector">

                            <button type="button" onclick="cambiarCantidad(-1)">−</button>

                            <span id="cantidad">1</span>

                            <button type="button" onclick="cambiarCantidad(1)">+</button>

                        </div>

                    </div>

                    <button class="addBtn" onclick="saveItem()">
                        Añadir
                    </button>

                </div>

            </div>

        </div>

        <div class="modal hidden" id="modalEditar">

    <div class="modal-anadir-alimentos">

        <div class="cabecera-modal">
            <h3>Editar alimento</h3>

            <button onclick="cerrarEditar()">✕</button>
        </div>


        <div class="modal-body">

            <input id="editarNombre" type="text" placeholder="Alimento">


            <input id="editarFecha" type="date">


            <div class="cantidad-selector">

                <button type="button" onclick="cambiarCantidadEditar(-1)">
                    −
                </button>

                <span id="editarCantidad">1</span>

                <button type="button" onclick="cambiarCantidadEditar(1)">
                    +
                </button>

            </div>


            <button class="addBtn" onclick="guardarEditar()">
                Editar
            </button>

        </div>

    </div>

</div>
<!-- PANTALLAS -->
<div class="pantalla">


    <div id="alimentosTab">

        <div class="pantalla-alimentos">

            <div id="lista"></div>

            <button class="button-anadir-alimento" onclick="abrirModal()">
                +
            </button>

        </div>

    </div>


    <div id="semanaTab" class="hidden">

        <div class="semana-container" id="semanaLista"></div>

    </div>

    <div class="modal hidden" id="modalComida">

    <div class="modal-anadir-alimentos comida-modal">

        <div class="cabecera-modal">

            <h3 id="tituloDiaComida">
                Añadir comidas
            </h3>

            <button onclick="cerrarComida()">
                ✕
            </button>

        </div>


        <div class="modal-body">

            <div id="listaAlimentosComida" class="lista-comida">

            </div>


            <button class="addBtn" onclick="guardarComidaDia()">
                Guardar
            </button>

        </div>

    </div>

</div>

</div>

        <nav class="nav-footer">

    <span id="btnAlimentos" class="active"
        onclick="mostrarPantalla('alimentos')">
        Alimentos
    </span>

    <span id="btnSemana"
        onclick="mostrarPantalla('semana')">
        Semana
    </span>

</nav>

</nav>

    </div>

    <script src="src/js/utils.js"></script>
    <script src="src/js/db.js"></script>
    <script src="src/js/alimentos.js"></script>
    <script src="src/js/calendar.js"></script>

    <script src="src/js/app.js"></script>
    <script src="src/js/auth.js"></script>
    <script src="src/js/ui.js"></script>
    <script src="src/js/swipe.js"></script>

</body>

</html>
