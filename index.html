<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Expiree</title>

<link rel="stylesheet" href="src/styles/main.css">
<link rel="stylesheet" href="src/styles/modal.css">
<link rel="stylesheet" href="src/styles/list.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<body>




 <div class="modal">

    <div class="modal-anadir-alimentos">

        <div class="cabecera-modal">
            <h3>Añadir alimento</h3>
            <button class="cerrar">✕</button>
        </div>

        <div class="modal-body">

            <input type="text" placeholder="Alimento">

            <div class="botonera">
                <button class="frigo">Frigorífico</button>
                <button class="conge">Congelador</button>
                <button class="despe">Despensa</button>
            </div>

            <div class="botonera-2">
                <input type="date">
                <input type="number" placeholder="Cant">
            </div>

            <button class="addBtn">Añadir</button>

        </div>

    </div>

</div>



  <nav class="nav-footer">
    <span>Alimentos</span>
    <span>Semana</span>
  </nav>
</body>
