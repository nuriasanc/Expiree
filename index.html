<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Expiree</title>

<link rel="stylesheet" href="src/styles/main.css">
<link rel="stylesheet" href="src/styles/modal.css">
<link rel="stylesheet" href="src/styles/list.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<!-- LOADER -->
<div id="bootScreen" class="boot-screen">
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="auth" class="auth hidden">

  <div class="auth-content">

    <input id="email" class="input" type="email" placeholder="Email">

    <input id="password" class="input" type="password" placeholder="Contraseña">

    <div id="authError" class="error"></div>

    <div class="buttons">
      <button class="btn primary" onclick="login()">Entrar</button>
      <button class="btn secondary" onclick="signup()">Crear cuenta</button>
    </div>

  </div>

</div>

<!-- APP -->
<div id="app" class="container hidden">

  <div class="topnav">

    <div class="brand">Expiree</div>

    <div class="user-menu" onclick="toggleMenu()">
      <i data-lucide="user"></i>

      <div id="dropdown" class="dropdown hidden">
        <div class="user-email" id="userEmail"></div>
        <button onclick="logout()">Cerrar sesión</button>
      </div>
    </div>

  </div>

  <div id="lista"></div>

</div>

<!-- BOTÓN + -->
<button id="addBtn" class="fab" onclick="openModal()">
  +
</button>

<!-- MODAL -->
<div id="modal" class="modal hidden">

  <div class="modal-content">

    <!-- cerrar -->
    <button class="close" onclick="closeModal()">×</button>

    <h3>Añadir alimento</h3>

    <input id="nombre" class="input" placeholder="Nombre del alimento">

    <!-- CONTENEDOR (ICONOS) -->
    <div class="contenedores">

      <button class="cat" id="cat1" onclick="setCat(1)">
        🧊<br><small>Congelador</small>
      </button>

      <button class="cat" id="cat2" onclick="setCat(2)">
        🥶<br><small>Frigorífico</small>
      </button>

      <button class="cat" id="cat3" onclick="setCat(3)">
        🥫<br><small>Despensa</small>
      </button>

    </div>

    <input id="fecha" type="date" class="input">

    <button class="save" onclick="saveItem()">Guardar</button>

    <p id="modalError" class="error"></p>

  </div>

</div>


<!-- SCRIPTS -->
<script src="src/js/db.js"></script>
<script src="src/js/auth.js"></script>
<script src="src/js/ui.js"></script>
<script src="src/js/swipe.js"></script>
<script src="src/js/calendar.js"></script>
<script src="src/js/app.js"></script>

</body>
</html>
