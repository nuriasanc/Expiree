<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Expiree</title>

<link rel="stylesheet" href="src/styles/main.css">
<link rel="stylesheet" href="src/styles/modal.css">
<link rel="stylesheet" href="src/styles/list.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

 <div class="modal hidden" id="modal">

    <div class="modal-anadir-alimentos">

        <div class="cabecera-modal">
            <h3>Añadir alimento</h3>
            <button class="cerrar" onclick="cerrarModal()">✕</button>
        </div>

        <div class="modal-body">

            <input type="text" placeholder="Alimento">

            <div class="botonera">
                <button class="frigo">Frigorífico</button>
                <button class="conge">Congelador</button>
                <button class="despe">Despensa</button>
            </div>

            <div class="botonera-2">
                <input type="date">
                <div class="cantidad-selector">

    <button type="button" onclick="cambiarCantidad(-1)">−</button>

    <span id="cantidad">1</span>

    <button type="button" onclick="cambiarCantidad(1)">+</button>

</div>
            </div>

            <button class="addBtn">Añadir</button>

        </div>

    </div>

</div>



<div class="pantalla">
<div class="pantalla-alimentos">

  <div class="alimento">

    <div class="alimento-titulo">
        <h3>Salchichas</h3>
        <span class="estado cerrado">Cerrado</span>
    </div>

    <div class="alimento-info">
        <span>🥩 1 unidad</span>
        <span>📅 3 días</span>
    </div>

</div>
  <button class="button-anadir-alimento" onclick="abrirModal()">+</button>

</div>

<!-- AQUI DEBAJO VA MI OTRA PANTALLA-->

</div>

  <nav class="nav-footer">
    <span>Alimentos</span>
    <span>Semana</span>
  </nav>
</body>

<script src="src/js/db.js"></script>
<script src="src/js/auth.js"></script>
<script src="src/js/ui.js"></script>
<script src="src/js/swipe.js"></script>
<script src="src/js/calendar.js"></script>
<script src="src/js/app.js"></script>
