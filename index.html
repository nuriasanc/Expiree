<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Expiree</title>

<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="container">
  <h2>Expiree</h2>
  <div id="lista"></div>
</div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- MODAL CREAR -->
<div id="modal" class="modal hidden">
  <div class="modal-content" onclick="event.stopPropagation()">

    <div class="row">
      <input id="nombre" placeholder="Nombre">

      <div class="qty">
        <input id="qty" type="number" value="1" min="1">
        <div class="qty-buttons">
          <button onclick="qty.value++">+</button>
          <button onclick="qty.value = Math.max(1, qty.value-1)">-</button>
        </div>
      </div>
    </div>

    <input id="fecha" type="date" class="fecha">

    <div class="cats">
      <button onclick="setCat('Nevera',this)">
        <i data-lucide="package"></i>
        <span>Nevera</span>
      </button>

      <button onclick="setCat('Congelador',this)">
        <i data-lucide="snowflake"></i>
        <span>Congelador</span>
      </button>

      <button onclick="setCat('Despensa',this)">
        <i data-lucide="archive"></i>
        <span>Despensa</span>
      </button>
    </div>

    <button class="btn" onclick="addItem()">Guardar</button>

  </div>
</div>

<!-- MODAL ABRIR -->
<div id="openModal" class="modal hidden">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Abrir alimento</h3>
    <input id="diasAbierto" type="number" placeholder="¿En cuántos días caduca?">

    <button class="btn" onclick="confirmOpen()">Confirmar</button>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
