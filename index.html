<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Expiree</title>

<link rel="stylesheet" href="src/styles/main.css">
<link rel="stylesheet" href="src/styles/modal.css">
<link rel="stylesheet" href="src/styles/list.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<!-- LOGIN -->
<div id="auth" class="auth">
  <h2>Expiree</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
  <button onclick="signup()">Crear cuenta</button>
</div>

<!-- APP -->
<div class="container hidden" id="app">

  <h2>Expiree</h2>
  <div id="lista"></div>

  <button class="add-btn" onclick="openModal()">+</button>

</div>

<!-- NAV -->
<div class="nav hidden" id="nav">
  <button onclick="showTab('lista')">Lista</button>
  <button onclick="showTab('calendar')">Semana</button>
</div>

<script src="src/js/db.js"></script>
<script src="src/js/auth.js"></script>
<script src="src/js/ui.js"></script>
<script src="src/js/swipe.js"></script>
<script src="src/js/calendar.js"></script>
<script src="src/js/app.js"></script>

</body>
</html>
