<!-- MODAL EDITAR -->
<div id="editModal" class="modal hidden">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Editar alimento</h3>

    <input id="editNombre" placeholder="Nombre">

    <div class="row">
      <input id="editQty" type="number" min="1">

      <div class="qty-buttons">
        <button onclick="editQty.value++">+</button>
        <button onclick="editQty.value = Math.max(1, editQty.value-1)">-</button>
      </div>
    </div>

    <div id="editFechaContainer">
      <input id="editFecha" type="date">
    </div>

    <div id="editDiasContainer" style="display:none;">
      <input id="editDias" type="number" placeholder="Días hasta caducar">
    </div>

    <button class="btn" onclick="toggleEstado()">Cambiar estado</button>

    <button class="btn" onclick="saveEdit()">Guardar</button>

  </div>
</div>
