<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expiree</title>

<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="container">
  <h2>Expiree</h2>
  <div id="lista"></div>
</div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- MODAL CREAR -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <input id="nombre" placeholder="Nombre">
    <input id="fecha" type="date">

    <div class="cats">
      <button onclick="setCat('Nevera',this)">
        <i data-lucide="fridge"></i>
        <span>Nevera</span>
      </button>

      <button onclick="setCat('Congelador',this)">
        <i data-lucide="snowflake"></i>
        <span>Congelador</span>
      </button>

      <button onclick="setCat('Despensa',this)">
        <i data-lucide="archive"></i>
        <span>Despensa</span>
      </button>
    </div>

    <div class="qty">
      <button onclick="qty.value = Math.max(1, qty.value-1)">-</button>
      <input id="qty" type="number" value="1" min="1">
      <button onclick="qty.value++">+</button>
    </div>

    <button class="btn" onclick="addItem()">Guardar</button>

  </div>
</div>

<!-- MODAL ABIERTO -->
<div id="openModal" class="modal hidden">
  <div class="modal-content">

    <h3>Marcar como abierto</h3>
    <input id="diasAbierto" type="number" placeholder="Días hasta caducar">

    <button class="btn" onclick="confirmOpen()">Confirmar</button>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
